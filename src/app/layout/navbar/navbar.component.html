<header class="navbar" [class.scrolled]="scrolled()">
  <div class="navbar__inner container">

    <!-- Logo -->
    <a routerLink="/" class="navbar__logo"  aria-label="TilStack — Home">
      <span class="navbar__logo-dot" aria-hidden="true"></span>
      <span class="navbar__logo-wordmark">
        <span class="navbar__logo-til">Til</span><span class="navbar__logo-stack">Stack</span>
      </span>
    </a>

    <!-- Desktop nav -->
    <nav class="navbar__links" aria-label="Main navigation">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="navbar__link"
        >{{ i18n.t(link.key) }}</a>
      }
    </nav>

    <!-- Actions -->
    <div class="navbar__actions">
      <!-- Langue : un seul bouton, il affiche l'autre langue (FR actif -> « EN », EN actif -> « FR ») -->
      <button
        type="button"
        class="navbar__lang"
        (click)="i18n.toggleLang()"
        [attr.lang]="i18n.lang() === 'fr' ? 'en' : 'fr'"
        [attr.aria-label]="i18n.lang() === 'fr' ? 'EN — switch to English' : 'FR — passer en français'"
      >{{ i18n.lang() === 'fr' ? 'EN' : 'FR' }}</button>

      <!-- Theme toggle -->
      <button class="navbar__action navbar__theme-btn" (click)="themeService.toggle()" aria-label="Toggle theme">
        @if (!themeService.isDark()) {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        }
      </button>
    </div>
  </div>
</header>

<!-- Barre d'onglets mobile (< 1024 px) : comme une application, en bas de l'écran. L'onglet actif déplie son nom à côté de l'icône. -->
<nav class="tabbar" aria-label="Mobile navigation">
  @for (link of links; track link.path) {
    <a
      [routerLink]="link.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: link.path === '/' }"
      class="tabbar__item"
      [attr.aria-label]="i18n.t(link.key)"
    >
      <svg class="tabbar__icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        @switch (link.icon) {
          @case ('home') { <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/> }
          @case ('user') { <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/> }
          @case ('folder') { <rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/> }
          @case ('bag') { <path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/> }
          @case ('blog') { <path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/> }
          @case ('quote') { <path d="M4 17c0-4 1-7 5-9"/><path d="M4 17h5v-5H4"/><path d="M14 17c0-4 1-7 5-9"/><path d="M14 17h5v-5h-5"/> }
          @case ('mail') { <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/> }
        }
      </svg>
      <span class="tabbar__label">{{ i18n.t(link.key) }}</span>
    </a>
  }
</nav>
