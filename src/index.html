<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>TilStack — Portfolio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#14213D" />
    <!-- Police du corps de texte (variable : toutes les graisses) : seule précharge, les titres Poppins se chargent ensuite. -->
    <link rel="preload" href="fonts/inter-v20-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Avant le premier rendu : applique le thème (localStorage, puis prefers-color-scheme)
         pour éviter un flash. La classe js-anim (révélation au défilement) est posée par l'application
         une fois le premier écran affiché : jusque-là tout le contenu reste visible. -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem('portfolio-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          d.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
